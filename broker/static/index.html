<!DOCTYPE html>
<html lang="en" data-nx="default-dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notebook</title>
  <link rel="stylesheet" href="/static/themes.css" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-head">
        <span class="brand-logo"></span><span class="brand-name">Notebook</span>
      </div>
      <button class="new-btn" id="new-btn">&#43;&nbsp; New notebook</button>
      <div class="search"><input id="search" type="text" placeholder="Search notebooks&hellip;" autocomplete="off" /></div>
      <div class="section-label">Notebooks</div>
      <div class="list" id="list"></div>
      <div class="side-foot">
        <div class="acct"><span class="email" id="email">&hellip;</span><button class="logout" id="logout">Log out</button></div>
      </div>
    </aside>
    <main class="main">
      <div class="dash-head"><h1>Your notebooks</h1></div>
      <div class="empty" id="empty">
        <div class="big">Select or create a notebook</div>
        <div class="sub">Open a notebook from the sidebar to start an isolated session.</div>
      </div>
    </main>
  </div>
  <div class="ctx-menu" id="ctx-menu" hidden>
    <button data-act="open">Open</button>
    <button data-act="rename">Rename</button>
    <div class="sep"></div>
    <button data-act="delete" class="danger">Delete</button>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
