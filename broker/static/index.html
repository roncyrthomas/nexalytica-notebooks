<!DOCTYPE html>
<html lang="en" data-nx="default-dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notebook</title>
  <link rel="stylesheet" href="/static/themes.css" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-head">
        <span class="brand-logo"></span><span class="brand-name">Notebook</span>
      </div>
      <button class="new-btn" id="new-btn">&#43;&nbsp; New notebook</button>
      <div class="search"><input id="search" type="text" placeholder="Search notebooks&hellip;" autocomplete="off" /></div>
      <div class="section-label">Notebooks</div>
      <div class="list" id="list"></div>
      <div class="side-foot">
        <label for="theme">Theme</label>
        <select class="theme-select" id="theme"></select>
        <div class="acct"><span class="email" id="email">&hellip;</span><button class="logout" id="logout">Log out</button></div>
      </div>
    </aside>
    <main class="main">
      <div class="frames" id="frames"></div>
      <div class="loading" id="loading" hidden>
        <div class="sk">
          <div class="sk-bar w55"></div>
          <div class="sk-bar w80"></div>
          <div class="sk-bar w40"></div>
          <div class="sk-card"></div>
          <div class="sk-bar w70"></div>
          <div class="sk-bar w50"></div>
          <div class="sk-card sk-card-sm"></div>
        </div>
        <div class="sk-note">Starting your notebook&hellip;</div>
      </div>
      <div class="empty" id="empty">
        <div class="big">No notebook open</div>
        <div class="sub">Create or open a notebook from the sidebar to start an isolated, instant session.</div>
      </div>
    </main>
  </div>
  <div class="ctx-menu" id="ctx-menu" hidden>
    <button data-act="open">Open</button>
    <button data-act="rename">Rename</button>
    <button data-act="close">Stop session</button>
    <div class="sep"></div>
    <button data-act="delete" class="danger">Delete</button>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
